services:
  peerlab-postgres:
    image: postgres:18
    container_name: peerlab-postgres
    environment:
      POSTGRES_DB: peerlab_gateway
      POSTGRES_USER: peerlab_user
      POSTGRES_PASSWORD: peerlab_password
    networks:
      peerlab_integration:
        ipv4_address: 10.1.0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerlab_user -d peerlab_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  peerlab-gateway:
    build: ..
    container_name: peerlab-gateway
    command: >
      -v --bypass-jwt
      --database-url=postgresql://peerlab_user:peerlab_password@10.1.0.50/peerlab_gateway
      --prefix-pool-file=/config/prefixes.txt
      --agent-key=test-agent-secret-key
    ports:
      - "8081:8080" # Using port 8081 to avoid conflict with saimiris-gateway
    volumes:
      - ./config/prefixes.txt:/config/prefixes.txt:ro
    networks:
      peerlab_integration:
        ipv4_address: 10.1.0.10
    depends_on:
      peerlab-postgres:
        condition: service_healthy

networks:
  peerlab_integration:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.1.0.0/24
          gateway: 10.1.0.1
        - subnet: 2001:db8:1::/64
          gateway: 2001:db8:1::1
